<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<title>Spinners</title>
</h:head>
<body>
<h:form>
	<h3>Book a start time</h3>
	<p:panelGrid columns="3" border="3">
	<p:calendar value="#{timeBean.sampleDate}"
				pattern="MM/dd/yy HH:mm"
				minHour="9" maxHour="18">
	<p:ajax event="dateSelect" update="selection"/>
	</p:calendar>
		<p></p>		
	<h:outputText value="#{timeBean.sampleTime}" id="selection"/>
	</p:panelGrid>
	</h:form>	
</body>
</html>
