<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"> 
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">
     
<h:head>
	<title>PrimeFaces</title>
</h:head> 
<body> 
<h3>Input data using Spinner and Calendar</h3>
<h:form>
	<b>Choose number:</b> <p:spinner value="#{testBean.number}"/><br/>
	<b>Choose date:</b> <p:calendar showButtonPanel="true" navigator="true" effect="explode" value="#{testBean.date}"/><br/>
	<p:commandButton action="#{testBean.doAction}" value="Submit"/>
	</h:form>
</body> 
</html>
